[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "knockout-primers"
version = "1.0.0"
description = "Design nested colony-PCR primers that verify Keio-collection gene deletions in E. coli"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Domenico Provenzano" }]
keywords = ["pcr", "primer design", "keio", "escherichia coli", "knockout", "molecular biology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.80",
  "primer3-py>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/prvnzn/knockout-primer-design"
Issues = "https://github.com/prvnzn/knockout-primer-design/issues"

[project.scripts]
knockout-primers = "knockout_primers.cli:main"

[tool.setuptools]
packages = ["knockout_primers"]

[tool.setuptools.package-data]
knockout_primers = ["data/*.yaml", "data/*.fasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs NCBI access (deselect with -m 'not network')"]
